# azure-pipelines.yml
# Practica CI/CD - App Node.js/Express -> Azure App Service
trigger:
  branches:
    include:
      - main

variables:
  # Cambia esto por el nombre real de tu App Service (Paso 3)
  webAppName: 'nombre-de-tu-app-service'
  # Cambia esto por el nombre de la Service Connection creada en Paso 3
  azureSubscription: 'nombre-de-tu-service-connection'

stages:

########################################
# ETAPA 1: CI - Build & Test
########################################
- stage: CI
  displayName: 'Build & Test'
  jobs:
    - job: BuildAndTest
      pool:
        vmImage: 'ubuntu-latest'
      steps:
        - task: NodeTool@0
          inputs:
            versionSpec: '18.x'
          displayName: 'Instalar Node.js'

        - script: |
            npm install
          displayName: 'npm install'

        - script: |
            npm test
          displayName: 'npm test (Jest)'

        - task: PublishTestResults@2
          condition: succeededOrFailed()
          inputs:
            testResultsFormat: 'JUnit'
            testResultsFiles: '**/test-results/junit.xml'
          displayName: 'Publicar resultados de pruebas'

        - script: |
            mkdir -p deploy_temp
            cp -r server.js package.json package-lock.json node_modules deploy_temp/ 2>/dev/null || true
            cd deploy_temp && zip -r ../app.zip . -x "test/*"
          displayName: 'Empaquetar artefacto (zip)'

        - task: PublishBuildArtifacts@1
          inputs:
            PathtoPublish: 'app.zip'
            ArtifactName: 'drop'
          displayName: 'Publicar artefacto de build'

########################################
# ETAPA 2: CD - Deploy a Azure App Service
########################################
- stage: Deploy
  displayName: 'Deploy a Azure App Service'
  dependsOn: CI
  condition: succeeded()
  jobs:
    - deployment: DeployWeb
      environment: 'produccion'
      pool:
        vmImage: 'ubuntu-latest'
      strategy:
        runOnce:
          deploy:
            steps:
              - task: AzureWebApp@1
                inputs:
                  azureSubscription: '$(azureSubscription)'
                  appType: 'webAppLinux'
                  appName: '$(webAppName)'
                  package: '$(Pipeline.Workspace)/drop/app.zip'
                  runtimeStack: 'NODE|18-lts'
                displayName: 'Desplegar en Azure App Service'
